services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brewlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlog}
      POSTGRES_DB: brewlog
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlog"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://brewlog:${POSTGRES_PASSWORD:-brewlog}@postgres:5432/brewlog
      MONGO_URL: mongodb://mongo:27017/brewlog_chat
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-10}
      REFRESH_TOKEN_HOURS: ${REFRESH_TOKEN_HOURS:-24}
      REFRESH_IDLE_MINUTES: ${REFRESH_IDLE_MINUTES:-15}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-BrewLog <onboarding@resend.dev>}
      ALLOW_DEV_MAGIC_LINK: ${ALLOW_DEV_MAGIC_LINK:-true}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@brewlog.ro}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-Admin123!}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8001:8000"

  frontend:
    build: ./brewlog
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    environment:
      LAN_HOST: ${LAN_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - frontend
      - api

volumes:
  pg_data:
  mongo_data:
  caddy_data:
  caddy_config:
